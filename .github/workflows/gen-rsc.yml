name: Generate antifilter RSC

on:
  schedule:
    - cron: "0 2 * * *" # ежедневно в 02:00 UTC
  workflow_dispatch:

# Если запусков несколько — оставляем только последний.
concurrency:
  group: gen-antifilter-rsc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate .rsc
        run: |
          chmod +x scripts/gen-antifilter-rsc.sh
          ./scripts/gen-antifilter-rsc.sh

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/antifilter.rsc
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: update antifilter list $(date -u +%F)"
            git push
          fi
