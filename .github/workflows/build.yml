name: Build & Push multiarch

on:
  schedule:
    - cron: "0 3 * * 1" # каждый понедельник в 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "tun.yml.template"
      - ".github/workflows/build.yml"

concurrency:
  group: build-multiarch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Fallback-версии, если GitHub API не отдаст latest.
  BYEDPI_FALLBACK: v0.17.3
  HEV_FALLBACK: "2.17.1"
  IMAGE_NAME: byedpi-tun

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect latest upstream versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BYEDPI=$(curl -sf https://api.github.com/repos/hufrea/byedpi/releases/latest | jq -r '.tag_name // empty')
          HEV=$(curl -sf https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest | jq -r '.tag_name // empty')
          BYEDPI="${BYEDPI:-${BYEDPI_FALLBACK}}"
          HEV="${HEV:-${HEV_FALLBACK}}"
          echo "byedpi=$BYEDPI" >> "$GITHUB_OUTPUT"
          echo "hev=$HEV"       >> "$GITHUB_OUTPUT"
          echo "Building ByeDPI=$BYEDPI  Hev=$HEV"

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          build-args: |
            BYEDPI_VER=${{ steps.ver.outputs.byedpi }}
            HEV_VER=${{ steps.ver.outputs.hev }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:byedpi-${{ steps.ver.outputs.byedpi }}-hev-${{ steps.ver.outputs.hev }}
          # Отключаем аттестации provenance — иначе манифест пухнет и некоторые клиенты не тянут его.
          provenance: false
          # Кэш слоёв в Actions Cache — сильно ускоряет повторные сборки.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### ✅ Published"
            echo "- ByeDPI: \`${{ steps.ver.outputs.byedpi }}\`"
            echo "- Hev:     \`${{ steps.ver.outputs.hev }}\`"
            echo "- Image:   \`ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
